<!DOCTYPE html>
<html lang="es">
{% load static difusco %}
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link rel="stylesheet" href="{% asset 'mapviewer/css/tokens.css' %}">
    <!-- Aplica el tema guardado (claro/oscuro) -->
    <script src="{% asset 'mapviewer/js/theme_toggle.js' %}"></script>
    <style>
        body {
            background-color: var(--paper);
            color: var(--ink);
            font-family: var(--font-sans);
            text-align: center;
            padding: var(--space-16) var(--space-6);
        }

        .error-container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 44px;
            line-height: 52px;
            font-weight: 600;
            margin-bottom: var(--space-2);
            color: var(--danger);
        }

        p {
            font-size: 18px;
            line-height: 28px;
            color: var(--ink-muted);
        }

        a {
            color: var(--unam-blue);
            text-decoration: underline;
            font-weight: 600;
        }

        a:hover {
            color: var(--unam-blue-hover);
        }

        a:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>{{ codigo_error }}</h1>
        <p>{{ mensaje_error }}</p>
        <p><a href="{% url 'ficha_tecnica' %}">Volver al inicio</a></p>
    </div>
</body>
</html>
