services:
  web:
    build: .
    ports:
      - "8000:8080"
    volumes:
      - .:/app
      - /app/venv  # Excluir el directorio venv del volumen
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DEBUG=True
      - PORT=8080
    command: python manage.py runserver 0.0.0.0:8080
    restart: unless-stopped

